<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Aura Glow Core -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Arc Primary Gradient -->
    <linearGradient id="auraFlow" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Crossbeam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Accent Light Ring -->
    <linearGradient id="haloRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background Aura Halo -->
  <circle cx="128" cy="128" r="108" fill="url(#auraGlow)"/>

  <!-- Outer Orbital Ring (Cosmic Aura) -->
  <circle cx="128" cy="128" r="100" stroke="url(#haloRing)" stroke-width="2.5" stroke-dasharray="140 18 40 18" stroke-linecap="round"/>

  <!-- Left Pillar / Upward Flow -->
  <path d="M68 196 L112 72 C116 61 123 55 128 55 C133 55 140 61 144 72 L188 196" 
        stroke="url(#auraFlow)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Inner Dynamic Payment Arch (The Arc bridge) -->
  <path d="M96 156 Q128 126 160 156" 
        stroke="url(#beamGrad)" 
        stroke-width="14" 
        stroke-linecap="round"/>

  <!-- Center Floating Core / Light Orb -->
  <circle cx="128" cy="106" r="12" fill="#FFFFFF"/>
  <circle cx="128" cy="106" r="22" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6"/>
</svg>
